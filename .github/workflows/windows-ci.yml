name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'qualification/**'
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        shell: pwsh
        run: python -m compileall -q marketradar tools

      - name: Fast integration regression
        if: ${{ github.event_name != 'push' || github.ref_name != 'main' }}
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_v418_deep_discovery.py
          tests/test_v420_platform_discovery.py
          tests/test_v421_access_and_tor.py
          tests/test_v421_tor_search.py
          tests/test_v421_platform_bridge.py
          tests/test_claim_intelligence.py

      - name: Full regression on protected integration
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        shell: pwsh
        run: python -m pytest -q

      - name: Clean generated test artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Force |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq '.pytest_cache' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter '*.pyc' -Force |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Product audit
        shell: pwsh
        run: python -B tools/product_audit.py

      - name: Release audit
        shell: pwsh
        run: python -B tools/release_audit.py

  live-search-smoke:
    runs-on: windows-latest
    env:
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Configure live search provider
        if: ${{ env.SEARXNG_URL != '' }}
        shell: pwsh
        run: |
          python -B tools/live_search_doctor.py

      - name: Live discovery smoke
        if: ${{ env.SEARXNG_URL != '' }}
        shell: pwsh
        env:
          MARKETRADAR_SEARCH_PROVIDER: searxng
        run: python -B -m marketradar.cli autonomous-discovery --max-cycles 1
