name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        shell: pwsh
        run: python -m compileall -q marketradar tools

      - name: Test
        shell: pwsh
        run: python -m pytest -q

      - name: Clean generated test artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Force |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq '.pytest_cache' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter '*.pyc' -Force |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Product audit
        shell: pwsh
        run: python -B tools/product_audit.py

      - name: Release audit
        shell: pwsh
        run: python -B tools/release_audit.py

  live-search-smoke:
    runs-on: windows-latest
    env:
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Configure live search provider
        if: ${{ env.SEARXNG_URL != '' }}
        shell: pwsh
        run: |
          python -B tools/live_search_doctor.py

      - name: Live discovery smoke
        if: ${{ env.SEARXNG_URL != '' }}
        shell: pwsh
        env:
          MARKETRADAR_SEARCH_PROVIDER: searxng
        run: python -B -m marketradar.cli autonomous-discovery --max-cycles 1


  windows-product:
    name: Windows product EXE and installer smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt
      - name: Build portable EXE and smoke test
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          & iscc "/DMyAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Installer install EXE and uninstall smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/installer/*Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP "MarketRadarInstalled"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait | Out-Null
          if (-not (Test-Path "$target/MarketRadar.exe")) { throw "Installed EXE missing" }
          $smoke = Start-Process -FilePath "$target/MarketRadar.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed EXE smoke test failed: $($smoke.ExitCode)" }
          $uiSmoke = Start-Process -FilePath "$target/MarketRadar.exe" -ArgumentList "--ui-smoke-test" -Wait -PassThru
          if ($uiSmoke.ExitCode -ne 0) { throw "Installed EXE UI smoke test failed: $($uiSmoke.ExitCode)" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          if (Test-Path "$target/MarketRadar.exe") { throw "Uninstall did not remove MarketRadar.exe" }
      - name: Upload Windows product artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-windows-product
          path: |
            release/portable/**
            release/installer/**


  android-companion:
    name: Android companion build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Assemble Android companion
        shell: bash
        run: gradle -p android-companion assembleDebug
      - name: Android emulator E2E
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" >/dev/null
          echo no | avdmanager create avd --force -n marketradar-ci -k "system-images;android-34;google_apis;x86_64" --device "pixel_2"
          nohup emulator -avd marketradar-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/marketradar-emulator.log 2>&1 &
          adb start-server
          adb wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1"
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0
          bash tools/android_e2e.sh
          adb emu kill || true
      - name: Upload Android companion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-android-companion
          path: |
            android-companion/app/build/outputs/apk/debug/*.apk
            android-qualification/**
