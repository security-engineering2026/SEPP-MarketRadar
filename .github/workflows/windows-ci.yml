name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        shell: pwsh
        run: python -m compileall -q marketradar tools
      - name: Test
        shell: pwsh
        run: python -m pytest -q
      - name: Product audit
        shell: pwsh
        run: python -B tools/product_audit.py
      - name: Release audit
        shell: pwsh
        run: python -B tools/release_audit.py

  live-search-smoke:
    if: ${{ secrets.SEARXNG_URL != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt
      - name: Configure live search provider
        shell: pwsh
        env:
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: |
          $env:SEARXNG_URL = $env:SEARXNG_URL
          python -B tools/live_search_doctor.py
      - name: Live discovery smoke
        shell: pwsh
        env:
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          MARKETRADAR_SEARCH_PROVIDER: searxng
        run: python -B -m marketradar.cli autonomous-discovery --max-cycles 1
