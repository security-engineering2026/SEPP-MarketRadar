name: Fast Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketradar-fast-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Fast Windows regression
    runs-on: [self-hosted, Windows, X64, marketradar]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve Python runtime
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null
          function Test-PythonCandidate([string]$candidate) {
            if (-not $candidate -or -not (Test-Path -LiteralPath $candidate)) { return $null }
            try {
              $versionText = (& $candidate --version 2>$null).Trim()
              if ($versionText -match 'Python (\d+)\.(\d+)\.(\d+)') {
                $major = [int]$Matches[1]; $minor = [int]$Matches[2]
                if ($major -gt 3 -or ($major -eq 3 -and $minor -ge 12)) { return $candidate }
              }
            } catch {}
            return $null
          }
          $pythonLauncher = (Get-Command py.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          if ($pythonLauncher) {
            try {
              $resolved = (& $pythonLauncher -3 -c "import sys; print(sys.executable)" 2>$null).Trim()
              if ($resolved) {
                $valid = Test-PythonCandidate $resolved
                if ($valid) { $python = $valid }
              }
            } catch {}
          }
          $candidates = @(
            (Get-Command python.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            "$env:ProgramFiles\Python*\python.exe",
            "$env:ProgramFiles\Python*\*\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python*\python.exe",
            "$env:USERPROFILE\AppData\Local\Programs\Python\Python*\python.exe",
            "C:\Python*\python.exe"
          )
          $userProfiles = Get-ChildItem -Path (Join-Path $env:SystemDrive "Users") -Directory -ErrorAction SilentlyContinue
          foreach ($profile in $userProfiles) {
            $candidates += Join-Path $profile.FullName "AppData\Local\Programs\Python\Python*\python.exe"
          }
          foreach ($pattern in ($candidates | Where-Object { $_ } | Select-Object -Unique)) {
            $found = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending
            foreach ($candidate in $found) {
              $valid = Test-PythonCandidate $candidate.FullName
              if ($valid) { $python = $valid; break }
            }
            if ($python) { break }
            $valid = Test-PythonCandidate $pattern
            if ($valid) { $python = $valid; break }
          }
          if (-not $python) {
            foreach ($root in @(
              "HKLM:\SOFTWARE\Python\PythonCore",
              "HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore",
              "HKCU:\SOFTWARE\Python\PythonCore"
            )) {
              foreach ($key in @(Get-ChildItem $root -ErrorAction SilentlyContinue | Sort-Object PSChildName -Descending)) {
                $install = (Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue).InstallPath
                $valid = Test-PythonCandidate (Join-Path $install "python.exe")
                if ($valid) { $python = $valid; break }
              }
              if ($python) { break }
            }
          }
          if (-not $python) {
            try {
              foreach ($path in @(where.exe python.exe 2>$null)) {
                $valid = Test-PythonCandidate $path
                if ($valid) { $python = $valid; break }
              }
            } catch {}
          }
          if (-not $python) {
            $root = Join-Path $env:RUNNER_TEMP "marketradar-python"
            $pkg = Join-Path $env:RUNNER_TEMP "python-3.13.15.nupkg"
            $url = "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg"
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            try {
              Invoke-WebRequest -Uri $url -OutFile $pkg -UseBasicParsing -TimeoutSec 240
            } catch {
              & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 -o $pkg $url
              if ($LASTEXITCODE -ne 0) { throw "Python bootstrap download failed; curl exit=$LASTEXITCODE" }
            }
            if ((Get-Item $pkg).Length -lt 1000000) { throw "Python bootstrap package is unexpectedly small." }
            Expand-Archive -LiteralPath $pkg -DestinationPath $root -Force
            $python = Get-ChildItem -LiteralPath $root -Filter "python.exe" -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
            $python = Test-PythonCandidate $python
          }
          if (-not $python) { throw "PYTHON_3_12_PLUS_NOT_FOUND" }
          "MARKETRADAR_PYTHON_EXE=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Split-Path $python | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & $python --version
          Write-Host "PYTHON_RUNTIME=PASS"
      - name: Install dependencies
        run: |
          & $env:MARKETRADAR_PYTHON_EXE -m pip install -r requirements-dev.txt pillow
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Compile
        run: |
          & $env:MARKETRADAR_PYTHON_EXE -m compileall -q marketradar tools
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }
      - name: Regression
        run: |
          & $env:MARKETRADAR_PYTHON_EXE -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Regression failed" }
      - name: Product audit
        run: |
          & $env:MARKETRADAR_PYTHON_EXE -B tools/product_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Product audit failed" }
      - name: Release audit
        run: |
          & $env:MARKETRADAR_PYTHON_EXE -B tools/release_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Release audit failed" }
