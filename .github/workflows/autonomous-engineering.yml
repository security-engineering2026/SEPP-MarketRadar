name: Autonomous Engineering Checkpoint
on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
concurrency:
  group: marketradar-autonomous-checkpoint
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run repository checkpoint
        env:
          AUTONOMOUS_CYCLE: github-${{ github.run_number }}
          AUTONOMOUS_TEST_COMMAND: "python -m pytest -q"
          AUTONOMOUS_TEST_TIMEOUT: "600"
        run: python tools/autonomous_supervisor.py
        continue-on-error: true
      - name: Push checkpoint
        if: always()
        run: |
          git status --short
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
          fi
