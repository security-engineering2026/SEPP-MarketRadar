name: Autonomous Supervisor Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: marketradar-autonomous-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run supervisor
        env:
          AUTONOMOUS_CYCLE: "${{ github.run_number }}"
          AUTONOMOUS_TEST_COMMAND: "python -m pytest -q"
          AUTONOMOUS_TEST_TIMEOUT: "600"
        run: python tools/autonomous_supervisor.py

      - name: Push checkpoint
        run: git push origin HEAD:main
