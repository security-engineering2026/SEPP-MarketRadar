          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.10'
      - name: Assemble Android companion
        shell: bash
        run: gradle -p android-companion assembleDebug
      - name: Android emulator E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/android_e2e.sh
      - name: Upload Android qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-android-qualification
          path: |
            android-qualification/**
            android-companion/app/build/outputs/apk/debug/*.apk
) {
                if ([version]$v -lt [version]'3.12') { Write-Host "PYTHON_VERSION_TOO_OLD=$v PATH=$candidate"; return $null }
                return $candidate
              }
            } catch {}
            return $null
          }
          $python = $null
          $launcher = (Get-Command py.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
