name: Full Qualification

on:
  push:
    branches:
      - main
      - 'qualification/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  windows-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Windows qualification
    runs-on: [self-hosted, Windows, X64, marketradar]
    timeout-minutes: 45
    env:
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
      QUALIFY_DYNAMIC_URL: ${{ secrets.QUALIFY_DYNAMIC_URL }}
      QUALIFY_ENGINE_URL: ${{ secrets.QUALIFY_ENGINE_URL }}
      QUALIFY_APPLICATION_URL: ${{ secrets.QUALIFY_APPLICATION_URL }}
      QUALIFY_PAYMENT_URL: ${{ secrets.QUALIFY_PAYMENT_URL }}
      QUALIFY_PUSH_URL: ${{ secrets.QUALIFY_PUSH_URL }}
      PYTHONUNBUFFERED: '1'
      QUALIFICATION_ARTIFACT_DIR: qualification-artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Prepare self-hosted Python
        shell: pwsh
        run: |
          $registry = @()
          foreach ($base in @(
            'HKLM:\SOFTWARE\Python\PythonCore',
            'HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore'
          )) {
            if (Test-Path $base) {
              $registry += Get-ChildItem $base -ErrorAction SilentlyContinue | ForEach-Object {
                $install = (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).InstallPath
                if ($install) { Join-Path $install 'python.exe' }
              }
            }
          }
          $wherePython = @(where.exe python.exe 2>$null)
          $wherePy = @(where.exe py.exe 2>$null)
          $candidates = @(
            (Get-Command python.exe -ErrorAction SilentlyContinue).Source,
            (Get-Command py.exe -ErrorAction SilentlyContinue).Source
          ) + $wherePython + $wherePy + $registry + @(Get-ChildItem 'C:\Program Files\Python*\python.exe','C:\Program Files\Python*\*\python.exe','C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $python = $null
          $tooOld = $false
          foreach ($candidate in ($candidates | Where-Object { $_ } | Select-Object -Unique)) {
            try {
              $v = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
              if ([version]$v -ge [version]'3.12') { $python = $candidate; break }
              $tooOld = $true
            } catch {}
          }
          if (-not $python) {
            # The qualification runner is self-hosted by design. Bootstrap Python when
            # the runner image does not provide a usable 3.12+ interpreter.
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
            if ($winget) {
              try {
                winget install --id Python.Python.3.12 --scope user --silent --accept-source-agreements --accept-package-agreements
              } catch {}
            }
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if (-not $python -and $choco) {
              try { choco install python --version=3.12.10 -y --no-progress } catch {}
            }
            $refresh = @(
              (Get-Command python.exe -ErrorAction SilentlyContinue).Source,
              (Get-Command py.exe -ErrorAction SilentlyContinue).Source
            ) + @(where.exe python.exe 2>$null) + @(where.exe py.exe 2>$null) + @(Get-ChildItem 'C:\Program Files\Python*\python.exe','C:\Program Files\Python*\*\python.exe','C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName)
            foreach ($candidate in ($refresh | Where-Object { $_ } | Select-Object -Unique)) {
              try {
                $v = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
                if ([version]$v -ge [version]'3.12') { $python = $candidate; break }
              } catch {}
            }
            if (-not $python) {
              if ($tooOld) { throw 'PYTHON_VERSION_TOO_OLD' }
              throw 'PYTHON_3_12_PLUS_NOT_FOUND'
            }
          }
          $shim = Join-Path $env:RUNNER_TEMP 'python-shim'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          ('@echo off' + [Environment]::NewLine + '"' + $python + '" %*') | Set-Content -Path (Join-Path $shim 'python.cmd') -Encoding ascii
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $python --version
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt pillow
      - name: Compile
        shell: pwsh
        run: python -m compileall -q marketradar tools
      - name: Core regression suite
        shell: pwsh
        run: python -m pytest -q
      - name: Optional Playwright runtime
        if: ${{ env.QUALIFY_DYNAMIC_URL != '' }}
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Full qualification gates
        shell: pwsh
        run: python -B tools/full_qualification.py
      - name: Clean generated test artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Force |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq '.pytest_cache' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter '*.pyc' -Force |
            Remove-Item -Force -ErrorAction SilentlyContinue
      - name: Product audit
        if: always()
        shell: pwsh
        run: |
          $version = (python -B -c "from marketradar import __version__; print(__version__)").Trim()
          $output = & python -B tools/product_audit.py 2>&1
          $code = $LASTEXITCODE
          $text = $output -join [Environment]::NewLine
          Write-Host $text
          $parsed = $null
          try { $parsed = $text | ConvertFrom-Json } catch { $parsed = @{ parse_error = $_.Exception.Message; raw_output = $text } }
          $report = [ordered]@{
            schema = "qualification-audit-result.v1"
            audit = "product_audit"
            product_version = $version
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            exit_code = [int]$code
            status = if ($code -eq 0) { "PASS" } else { "FAIL" }
            result = $parsed
          }
          New-Item -ItemType Directory -Force -Path qualification-artifacts | Out-Null
          $report | ConvertTo-Json -Depth 10 | Set-Content -Path qualification-artifacts/product_audit.json -Encoding utf8
          if ($code -ne 0) { throw "PRODUCT_AUDIT_FAILED:$code" }
      - name: Release audit
        if: always()
        shell: pwsh
        run: |
          $version = (python -B -c "from marketradar import __version__; print(__version__)").Trim()
          $output = & python -B tools/release_audit.py 2>&1
          $code = $LASTEXITCODE
          $text = $output -join [Environment]::NewLine
          Write-Host $text
          $parsed = $null
          try { $parsed = $text | ConvertFrom-Json } catch { $parsed = @{ parse_error = $_.Exception.Message; raw_output = $text } }
          $report = [ordered]@{
            schema = "qualification-audit-result.v1"
            audit = "release_audit"
            product_version = $version
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            exit_code = [int]$code
            status = if ($code -eq 0) { "PASS" } else { "FAIL" }
            result = $parsed
          }
          New-Item -ItemType Directory -Force -Path qualification-artifacts | Out-Null
          $report | ConvertTo-Json -Depth 10 | Set-Content -Path qualification-artifacts/release_audit.json -Encoding utf8
          if ($code -ne 0) { throw "RELEASE_AUDIT_FAILED:$code" }
      - name: Build portable EXE and smoke test
        if: always()
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Capture UI visual qualification
        if: always()
        shell: pwsh
        run: python -B tools/ui_visual_smoke.py
      - name: Install Inno Setup
        if: always()
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          & iscc "/DMyAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Installer install / EXE / UI / uninstall smoke
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/installer/*Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP "MarketRadarInstalled"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru | Out-Null
          if (-not (Test-Path "$target/MarketRadar.exe")) { throw "Installed EXE missing" }
          # Isolate clean-install qualification data from persistent self-hosted runner state.
          # This proves the installed candidate against its own shipped registry/config.
          $env:MARKETRADAR_DATA_ROOT = Join-Path $target "qualification-data"
          $smokeProcess = Start-Process -FilePath "$target/MarketRadar.exe" -ArgumentList @("--smoke-test") -Wait -PassThru
          $smokeExit = $smokeProcess.ExitCode
          Write-Host "INSTALLED_SMOKE_EXIT=$smokeExit"
          $logDir = Join-Path $env:MARKETRADAR_DATA_ROOT "logs"
          if (Test-Path $logDir) {
            Write-Host "=== INSTALLED MARKETRADAR LOG ==="
            Get-ChildItem $logDir -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
          }
          if ($smokeExit -ne 0) { throw "Installed EXE smoke test failed: $smokeExit" }
          $uiProcess = Start-Process -FilePath "$target/MarketRadar.exe" -ArgumentList @("--ui-smoke-test") -Wait -PassThru
          $uiExit = $uiProcess.ExitCode
          Write-Host "INSTALLED_UI_SMOKE_EXIT=$uiExit"
          if ($uiExit -ne 0) { throw "Installed EXE UI smoke test failed: $uiExit" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          if (Test-Path "$target/MarketRadar.exe") { throw "Uninstall did not remove MarketRadar.exe" }

      - name: Build source archive
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Force -Path release/source | Out-Null
          git archive --format=zip --output="release/source/SEPP-MarketRadar-v$version-SOURCE.zip" "HEAD"

      - name: Record release artifact identity
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          $artifacts = @(
            (Join-Path $PWD "release/portable/MarketRadar/MarketRadar.exe"),
            (Join-Path $PWD "release/installer/SEPP-MarketRadar-Setup-$version.exe"),
            (Join-Path $PWD "release/source/SEPP-MarketRadar-v$version-SOURCE.zip")
          )
          $records = @()
          foreach ($path in $artifacts) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "RELEASE_ARTIFACT_MISSING:$path"
            }
            $item = Get-Item $path
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            $records += [ordered]@{
              name = $item.Name
              path = $item.FullName
              size_bytes = [int64]$item.Length
              sha256 = $hash
            }
          }
          $identity = [ordered]@{
            schema = "release-artifact-identity.v1"
            version = $version
            generated_at = (Get-Date).ToUniversalTime().ToString("o")
            artifacts = $records
          }
          New-Item -ItemType Directory -Force -Path qualification-artifacts | Out-Null
          $identity | ConvertTo-Json -Depth 5 | Set-Content -Path qualification-artifacts/release_artifact_identity.json -Encoding utf8
          Get-Content qualification-artifacts/release_artifact_identity.json

      - name: Final qualification decision
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path qualification-artifacts/full_qualification.json)) {
            throw "Full qualification report missing"
          }
          $r = Get-Content qualification-artifacts/full_qualification.json -Raw | ConvertFrom-Json
          foreach ($auditName in @("product_audit","release_audit")) {
            $auditPath = "qualification-artifacts/$auditName.json"
            if (-not (Test-Path $auditPath)) {
              throw "QUALIFICATION_AUDIT_REPORT_MISSING:$auditName"
            }
            $audit = Get-Content $auditPath -Raw | ConvertFrom-Json
            if ([int]$audit.exit_code -ne 0 -or $audit.status -ne "PASS") {
              throw "QUALIFICATION_AUDIT_NOT_PASS:$auditName"
            }
            if ($audit.product_version -ne $r.product_version) {
              throw "QUALIFICATION_AUDIT_VERSION_MISMATCH:$auditName"
            }
          }
          Write-Host ("PASS=" + $r.summary.pass + " OPEN=" + $r.summary.open + " FAIL=" + $r.summary.fail)
          Write-Host "PRODUCT_AUDIT=PASS RELEASE_AUDIT=PASS VERSION=$($r.product_version)"
          if ([int]$r.summary.open -gt 0 -or [int]$r.summary.fail -gt 0) {
            throw "FULL_QUALIFICATION_NOT_FINAL"
          }

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketradar-windows-qualification
          path: |
            qualification-artifacts/**
            release/portable/**
            release/installer/**
            release/source/**
            reports/**

  android-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Android qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.10'
      - name: Assemble Android companion
        shell: bash
        run: gradle -p android-companion assembleDebug
      - name: Android emulator E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect -noaudio -camera-back none
          script: bash tools/android_e2e.sh
      - name: Upload Android qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-android-qualification
          path: |
            android-qualification/**
            android-companion/app/build/outputs/apk/debug/*.apk
