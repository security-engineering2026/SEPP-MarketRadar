        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m pip install -r requirements-dev.txt pillow'
      - name: Compile
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m compileall -q marketradar tools'
      - name: Core regression suite
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m pytest -q'
      - name: Optional Playwright runtime
        if: ${{ env.QUALIFY_DYNAMIC_URL != '' }}
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
