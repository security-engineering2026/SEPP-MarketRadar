name: Full Qualification

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-qualification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  windows-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Windows qualification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
      QUALIFY_DYNAMIC_URL: ${{ secrets.QUALIFY_DYNAMIC_URL }}
      QUALIFY_ENGINE_URL: ${{ secrets.QUALIFY_ENGINE_URL }}
      QUALIFY_APPLICATION_URL: ${{ secrets.QUALIFY_APPLICATION_URL }}
      QUALIFY_PAYMENT_URL: ${{ secrets.QUALIFY_PAYMENT_URL }}
      QUALIFY_PUSH_URL: ${{ secrets.QUALIFY_PUSH_URL }}
      PYTHONUNBUFFERED: '1'
      QUALIFICATION_ARTIFACT_DIR: qualification-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt pillow
      - name: Start qualification sandbox
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:QUALIFICATION_ARTIFACT_DIR | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "marketradar-qualification-sandbox.log"
          $err = Join-Path $env:RUNNER_TEMP "marketradar-qualification-sandbox.err.log"
          $p = Start-Process python -ArgumentList @("-B","tools/qualification_sandbox.py","--host","127.0.0.1","--port","18080") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Set-Content -Path (Join-Path $env:QUALIFICATION_ARTIFACT_DIR "sandbox.pid") -Value $p.Id
          Start-Sleep -Seconds 2
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18080/health" | Out-Null
          if (-not $env:QUALIFY_DYNAMIC_URL) { "QUALIFY_DYNAMIC_URL=http://127.0.0.1:18080/dynamic" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if (-not $env:QUALIFY_ENGINE_URL) { "QUALIFY_ENGINE_URL=http://127.0.0.1:18080/engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if (-not $env:QUALIFY_APPLICATION_URL) { "QUALIFY_APPLICATION_URL=http://127.0.0.1:18080/application" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if (-not $env:QUALIFY_PAYMENT_URL) { "QUALIFY_PAYMENT_URL=http://127.0.0.1:18080/payment" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if (-not $env:QUALIFY_PUSH_URL) { "QUALIFY_PUSH_URL=http://127.0.0.1:18080/push" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: Compile
        shell: pwsh
        run: python -m compileall -q marketradar tools
      - name: Core regression suite
        shell: pwsh
        run: python -m pytest -q
      - name: Playwright runtime
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Full qualification gates
        shell: pwsh
        run: python -B tools/full_qualification.py
      - name: Clean generated test artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Force |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq '.pytest_cache' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter '*.pyc' -Force |
            Remove-Item -Force -ErrorAction SilentlyContinue
      - name: Product audit
        if: always()
        shell: pwsh
        run: python -B tools/product_audit.py
      - name: Release audit
        if: always()
        shell: pwsh
        run: python -B tools/release_audit.py
      - name: Build portable EXE and smoke test
        if: always()
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Capture UI visual qualification
        if: always()
        shell: pwsh
        run: python -B tools/ui_visual_smoke.py
      - name: Install Inno Setup
        if: always()
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          & iscc "/DMyAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Installer install / EXE / UI / uninstall smoke
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/installer/*Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP "MarketRadarInstalled"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru | Out-Null
          if (-not (Test-Path "$target/MarketRadar.exe")) { throw "Installed EXE missing" }
          $installedData = Join-Path $env:RUNNER_TEMP "MarketRadarInstalledData"
          if (Test-Path $installedData) { Remove-Item $installedData -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $installedData | Out-Null
          $env:MARKETRADAR_DATA_ROOT = $installedData
          & "$target/MarketRadar.exe" --smoke-test
          $smokeExit = $LASTEXITCODE
          $installedLog = Join-Path $target "installed-smoke.log"
          $defaultLog = Join-Path $env:LOCALAPPDATA "SEPP-MarketRadar\logs\marketradar.log"
          if (Test-Path $defaultLog) { Copy-Item $defaultLog $installedLog -Force }
          if ($smokeExit -ne 0) {
            if (-not (Test-Path $installedLog)) { "Installed smoke produced no application log at $defaultLog" | Set-Content $installedLog }
            Copy-Item $installedLog (Join-Path $env:QUALIFICATION_ARTIFACT_DIR "installed-smoke.log") -Force
            throw "Installed EXE smoke test failed: $smokeExit"
          }
          & "$target/MarketRadar.exe" --ui-smoke-test
          $uiSmokeExit = $LASTEXITCODE
          if (Test-Path $defaultLog) { Copy-Item $defaultLog (Join-Path $env:QUALIFICATION_ARTIFACT_DIR "installed-ui-smoke.log") -Force }
          if ($uiSmokeExit -ne 0) { throw "Installed EXE UI smoke test failed: $uiSmokeExit" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          if (Test-Path "$target/MarketRadar.exe") { throw "Uninstall did not remove MarketRadar.exe" }

      - name: Build source archive
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Force -Path release/source | Out-Null
          git archive --format=zip --output="release/source/SEPP-MarketRadar-v$version-SOURCE.zip" "HEAD"

      - name: Final qualification decision
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path qualification-artifacts/full_qualification.json)) {
            throw "Full qualification report missing"
          }
          $r = Get-Content qualification-artifacts/full_qualification.json -Raw | ConvertFrom-Json
          Write-Host ("PASS=" + $r.summary.pass + " OPEN=" + $r.summary.open + " FAIL=" + $r.summary.fail)
          if ([int]$r.summary.open -gt 0 -or [int]$r.summary.fail -gt 0) {
            throw "FULL_QUALIFICATION_NOT_FINAL"
          }

      - name: Stop qualification sandbox
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:QUALIFICATION_ARTIFACT_DIR "sandbox.pid"
          if (Test-Path $pidFile) {
            $sandboxPid = [int](Get-Content $pidFile -Raw)
            Stop-Process -Id $sandboxPid -Force -ErrorAction SilentlyContinue
          }

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-windows-qualification
          path: |
            qualification-artifacts/**
            release/portable/**
            release/installer/**
            release/source/**
            reports/**

  android-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Android qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Assemble Android companion
        shell: bash
        run: gradle -p android-companion assembleDebug
      - name: Android emulator E2E
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-boot-anim -noaudio -gpu swiftshader_indirect
          script: bash tools/android_e2e.sh
      - name: Upload Android qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketradar-android-qualification
          path: |
            android-qualification/**
            android-companion/app/build/outputs/apk/debug/*.apk

