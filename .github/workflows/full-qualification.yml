            }
            if ((Get-Item $pkg).Length -lt 1000000) { throw "Python bootstrap package is unexpectedly small." }
            Expand-Archive -LiteralPath $pkg -DestinationPath $root -Force
            $python = Get-ChildItem -LiteralPath $root -Filter "python.exe" -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
            $python = Test-PythonCandidate $python
          }
