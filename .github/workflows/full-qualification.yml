            "$env:ProgramFiles\Python*\*\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python*\python.exe",
            "$env:USERPROFILE\AppData\Local\Programs\Python\Python*\python.exe",
            "C:\Python*\python.exe"
          )
          $profiles = Get-ChildItem -Path (Join-Path $env:SystemDrive "Users") -Directory -ErrorAction SilentlyContinue
          foreach ($profile in $profiles) {
            $candidates += Join-Path $profile.FullName "AppData\Local\Programs\Python\Python*\python.exe"
          }
          foreach ($pattern in ($candidates | Where-Object { $_ } | Select-Object -Unique)) {
            foreach ($candidate in @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending)) {
              $valid = Test-PythonCandidate $candidate.FullName
              if ($valid) { $python = $valid; break }
            }
            if ($python) { break }
            $valid = Test-PythonCandidate $pattern
            if ($valid) { $python = $valid; break }
          }
          if (-not $python) {
            foreach ($root in @(
              "HKLM:\SOFTWARE\Python\PythonCore",
              "HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore",
              "HKCU:\SOFTWARE\Python\PythonCore"
            )) {
              foreach ($key in @(Get-ChildItem $root -ErrorAction SilentlyContinue | Sort-Object PSChildName -Descending)) {
                $install = (Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue).InstallPath
                $valid = Test-PythonCandidate (Join-Path $install "python.exe")
                if ($valid) { $python = $valid; break }
              }
              if ($python) { break }
            }
          }
          if (-not $python) {
            $root = Join-Path $env:RUNNER_TEMP "marketradar-python"
            $pkg = Join-Path $env:RUNNER_TEMP "python-3.13.15.nupkg"
            $url = "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg"
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            try {
              Invoke-WebRequest -Uri $url -OutFile $pkg -UseBasicParsing -TimeoutSec 240
            } catch {
              & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 -o $pkg $url
