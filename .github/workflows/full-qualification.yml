name: Full Qualification

on:
  push:
    branches:
      - main
      - 'qualification/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  windows-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Windows qualification
    runs-on: [self-hosted, Windows, X64, marketradar]
    timeout-minutes: 45
    env:
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
      QUALIFY_DYNAMIC_URL: ${{ secrets.QUALIFY_DYNAMIC_URL }}
      QUALIFY_ENGINE_URL: ${{ secrets.QUALIFY_ENGINE_URL }}
      QUALIFY_APPLICATION_URL: ${{ secrets.QUALIFY_APPLICATION_URL }}
      QUALIFY_PAYMENT_URL: ${{ secrets.QUALIFY_PAYMENT_URL }}
      QUALIFY_PUSH_URL: ${{ secrets.QUALIFY_PUSH_URL }}
      PYTHONUNBUFFERED: '1'
      QUALIFICATION_ARTIFACT_DIR: qualification-artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Prepare self-hosted Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Test-PythonCandidate([string]$candidate) {
            if (-not $candidate -or -not (Test-Path -LiteralPath $candidate)) { return $null }
            try {
              $v = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
              # PYTHON_VERSION_TOO_OLD: candidates below 3.12 are rejected here; fallback bootstrap is attempted next.
              if ($v -match '^(\d+)\.(\d+)
            } catch {}
            return $null
          }
          $python = $null
          $launcher = (Get-Command py.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          if ($launcher) {
            try {
              $resolved = (& $launcher -3 -c "import sys; print(sys.executable)" 2>$null).Trim()
              $python = Test-PythonCandidate $resolved
            } catch {}
          }
          $candidates = @(
            (Get-Command python.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            (Get-Command py.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            (where.exe python.exe 2>$null),
            "$env:ProgramFiles\Python*\python.exe",
            "$env:ProgramFiles\Python*\*\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python*\python.exe",
            "$env:USERPROFILE\AppData\Local\Programs\Python\Python*\python.exe",
            "C:\Python*\python.exe"
          )
          $profiles = Get-ChildItem -Path (Join-Path $env:SystemDrive "Users") -Directory -ErrorAction SilentlyContinue
          foreach ($profile in $profiles) {
            $candidates += Join-Path $profile.FullName "AppData\Local\Programs\Python\Python*\python.exe"
          }
          foreach ($pattern in ($candidates | Where-Object { $_ } | Select-Object -Unique)) {
            foreach ($candidate in @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending)) {
              $valid = Test-PythonCandidate $candidate.FullName
              if ($valid) { $python = $valid; break }
            }
            if ($python) { break }
            $valid = Test-PythonCandidate $pattern
            if ($valid) { $python = $valid; break }
          }
          if (-not $python) {
            foreach ($root in @(
              "HKLM:\SOFTWARE\Python\PythonCore",
              "HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore",
              "HKCU:\SOFTWARE\Python\PythonCore"
            )) {
              foreach ($key in @(Get-ChildItem $root -ErrorAction SilentlyContinue | Sort-Object PSChildName -Descending)) {
                $install = (Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue).InstallPath
                $valid = Test-PythonCandidate (Join-Path $install "python.exe")
                if ($valid) { $python = $valid; break }
              }
              if ($python) { break }
            }
          }
          if (-not $python) {
            $root = Join-Path $env:RUNNER_TEMP "marketradar-python"
            $pkg = Join-Path $env:RUNNER_TEMP "python-3.13.15.nupkg"
            $url = "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg"
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            try {
              Invoke-WebRequest -Uri $url -OutFile $pkg -UseBasicParsing -TimeoutSec 240
            } catch {
              & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 -o $pkg $url
              if ($LASTEXITCODE -ne 0) { throw "Python bootstrap download failed; curl exit=$LASTEXITCODE" }
            }
            if ((Get-Item $pkg).Length -lt 1000000) { throw "Python bootstrap package is unexpectedly small." }
            Expand-Archive -LiteralPath $pkg -DestinationPath $root -Force
            $python = Get-ChildItem -LiteralPath $root -Filter "python.exe" -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
            $python = Test-PythonCandidate $python
          }
          if (-not $python) { throw "PYTHON_3_12_PLUS_NOT_FOUND" }
          $shim = Join-Path $env:RUNNER_TEMP "python-shim"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          ('@echo off' + [Environment]::NewLine + '"' + $python + '" %*') | Set-Content -Path (Join-Path $shim 'python.cmd') -Encoding ascii
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MARKETRADAR_PYTHON_EXE=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $python --version
          Write-Host "PYTHON_RUNTIME=PASS"
      - name: Install dependencies
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m pip install -r requirements-dev.txt pillow'
      - name: Compile
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m compileall -q marketradar tools'
      - name: Core regression suite
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -m pytest -q'
      - name: Optional Playwright runtime
        if: ${{ env.QUALIFY_DYNAMIC_URL != '' }}
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Full qualification gates
        shell: pwsh
        run: '& $env:MARKETRADAR_PYTHON_EXE -B tools/full_qualification.py'
      - name: Clean generated test artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Force |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Name -eq '.pytest_cache' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter '*.pyc' -Force |
            Remove-Item -Force -ErrorAction SilentlyContinue
      - name: Product audit
        if: always()
        shell: pwsh
        run: python -B tools/product_audit.py
      - name: Release audit
        if: always()
        shell: pwsh
        run: python -B tools/release_audit.py
      - name: Build portable EXE and smoke test
        if: always()
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Capture UI visual qualification
        if: always()
        shell: pwsh
        run: python -B tools/ui_visual_smoke.py
      - name: Install Inno Setup
        if: always()
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          & iscc "/DMyAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Installer install / EXE / UI / uninstall smoke
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/installer/*Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP "MarketRadarInstalled"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue }
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru | Out-Null
          if (-not (Test-Path "$target/MarketRadar.exe")) { throw "Installed EXE missing" }
          & "$target/MarketRadar.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE smoke test failed: $LASTEXITCODE" }
          & "$target/MarketRadar.exe" --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE UI smoke test failed: $LASTEXITCODE" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          if (Test-Path "$target/MarketRadar.exe") { throw "Uninstall did not remove MarketRadar.exe" }

      - name: Build source archive
        if: always()
        shell: pwsh
        run: |
          $version = (python -c "from marketradar import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Force -Path release/source | Out-Null
          git archive --format=zip --output="release/source/SEPP-MarketRadar-v$version-SOURCE.zip" "HEAD"

      - name: Final qualification decision
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path qualification-artifacts/full_qualification.json)) {
            throw "Full qualification report missing"
          }
          $r = Get-Content qualification-artifacts/full_qualification.json -Raw | ConvertFrom-Json
          Write-Host ("PASS=" + $r.summary.pass + " OPEN=" + $r.summary.open + " FAIL=" + $r.summary.fail)
          if ([int]$r.summary.open -gt 0 -or [int]$r.summary.fail -gt 0) {
            throw "FULL_QUALIFICATION_NOT_FINAL"
          }

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketradar-windows-qualification
          path: |
            qualification-artifacts/**
            release/portable/**
            release/installer/**
            release/source/**
            reports/**

  android-qualification:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Android qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
